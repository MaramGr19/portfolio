<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 3D Runner Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #score {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        
        #health {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        
        .heart {
            width: 30px;
            height: 30px;
            background: #ff0000;
            transform: rotate(45deg);
            position: relative;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }
        
        .heart::before,
        .heart::after {
            content: "";
            width: 30px;
            height: 30px;
            background: #ff0000;
            border-radius: 50%;
            position: absolute;
        }
        
        .heart::before {
            left: -15px;
        }
        
        .heart::after {
            top: -15px;
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.8);
            pointer-events: all;
            z-index: 100;
        }
        
        #startScreen h1, #gameOverScreen h1 {
            color: #fff;
            font-size: 64px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0,255,255,0.8);
        }
        
        #startScreen p, #gameOverScreen p {
            color: #aaa;
            font-size: 20px;
            margin-bottom: 30px;
        }
        
        button {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(45deg, #00ffff, #0080ff);
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: all;
            box-shadow: 0 0 20px rgba(0,255,255,0.5);
        }
        
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0,255,255,0.8);
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="gameUI">
        <div id="score">Score: 0</div>
        <div id="health"></div>
        
        <div id="startScreen">
            <h1>3D RUNNER</h1>
            <p>Use Arrow Keys or A/D to move</p>
            <p>Collect coins, avoid obstacles</p>
            <button onclick="startGame()">START GAME</button>
        </div>
        
        <div id="gameOverScreen" class="hidden">
            <h1>GAME OVER</h1>
            <p id="finalScore">Score: 0</p>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game Configuration
        const config = {
            lanes: 3,
            laneWidth: 3,
            playerSpeed: 0.15,
            obstacleSpeed: 0.2,
            coinSpeed: 0.2,
            spawnInterval: 1500,
            speedIncrease: 0.001,
            maxSpeed: 0.5
        };

        // Game State
        let gameState = {
            score: 0,
            health: 3,
            speed: config.obstacleSpeed,
            isPlaying: false,
            currentLane: 1,
            targetLane: 1,
            lastSpawn: 0
        };

        // Three.js Setup
        let scene, camera, renderer, player;
        let obstacles = [];
        let coins = [];
        let groundSegments = [];
        let particleSystem;
        const clock = new THREE.Clock();

        // Object Pool for performance [web:2]
        class ObjectPool {
            constructor(factory, reset, size) {
                this.factory = factory;
                this.reset = reset;
                this.pool = [];
                // Pre-warm pool
                for (let i = 0; i < size; i++) {
                    const obj = factory();
                    obj.visible = false;
                    this.pool.push(obj);
                }
            }

            acquire() {
                const obj = this.pool.pop() || this.factory();
                obj.visible = true;
                return obj;
            }

            release(obj) {
                this.reset(obj);
                obj.visible = false;
                this.pool.push(obj);
            }
        }

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000033, 10, 100);

            // Camera setup
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 8, 10);
            camera.lookAt(0, 0, -10);

            // Renderer setup with antialiasing [web:2]
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000033);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.left = -20;
            directionalLight.shadow.camera.right = 20;
            directionalLight.shadow.camera.top = 20;
            directionalLight.shadow.camera.bottom = -20;
            scene.add(directionalLight);

            // Point lights for atmosphere
            const light1 = new THREE.PointLight(0x00ffff, 1, 50);
            light1.position.set(-10, 5, -20);
            scene.add(light1);

            const light2 = new THREE.PointLight(0xff00ff, 1, 50);
            light2.position.set(10, 5, -20);
            scene.add(light2);

            // Create ground segments [web:7]
            createGroundSegments();

            // Create player
            createPlayer();

            // Create particle system
            createParticles();

            // Initialize health display
            updateHealthDisplay();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);

            // Animation loop
            animate();
        }

        function createGroundSegments() {
            const segmentLength = 20;
            const numSegments = 5;

            for (let i = 0; i < numSegments; i++) {
                const groundGeometry = new THREE.PlaneGeometry(config.laneWidth * config.lanes, segmentLength);
                const groundMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a1a2e,
                    roughness: 0.8,
                    metalness: 0.2
                });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.position.z = -i * segmentLength;
                ground.receiveShadow = true;
                scene.add(ground);
                groundSegments.push(ground);

                // Add lane lines
                for (let j = 1; j < config.lanes; j++) {
                    const lineGeometry = new THREE.BoxGeometry(0.1, 0.1, segmentLength);
                    const lineMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                    const line = new THREE.Mesh(lineGeometry, lineMaterial);
                    line.position.set(
                        (j * config.laneWidth) - (config.lanes * config.laneWidth) / 2,
                        0.05,
                        -i * segmentLength
                    );
                    scene.add(line);
                    groundSegments.push(line);
                }
            }
        }

        function createPlayer() {
            const playerGroup = new THREE.Group();

            // Player body
            const bodyGeometry = new THREE.BoxGeometry(1, 1.5, 1);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x00ff00,
                metalness: 0.5,
                roughness: 0.5
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            playerGroup.add(body);

            // Player head
            const headGeometry = new THREE.SphereGeometry(0.5, 32, 32);
            const headMaterial = new THREE.MeshStandardMaterial({
                color: 0x00ffaa,
                metalness: 0.6,
                roughness: 0.4
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 1.2;
            head.castShadow = true;
            playerGroup.add(head);

            playerGroup.position.set(0, 1, 5);
            scene.add(playerGroup);
            player = playerGroup;
        }

        function createParticles() {
            const particlesGeometry = new THREE.BufferGeometry();
            const particleCount = 1000;
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 50;
                positions[i + 1] = Math.random() * 50;
                positions[i + 2] = -Math.random() * 100;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const particlesMaterial = new THREE.PointsMaterial({
                color: 0x00ffff,
                size: 0.1,
                transparent: true,
                opacity: 0.6
            });

            particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particleSystem);
        }

        function createObstacle(lane) {
            const obstacleGeometry = new THREE.BoxGeometry(1.5, 2, 1.5);
            const obstacleMaterial = new THREE.MeshStandardMaterial({
                color: 0xff0000,
                metalness: 0.7,
                roughness: 0.3
            });
            const obstacle = new THREE.Mesh(obstacleGeometry, obstacleMaterial);
            obstacle.castShadow = true;
            obstacle.position.set(getLanePosition(lane), 1, -50);
            obstacle.userData = { type: 'obstacle', lane: lane };
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function createCoin(lane) {
            const coinGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.2, 32);
            const coinMaterial = new THREE.MeshStandardMaterial({
                color: 0xffff00,
                metalness: 0.9,
                roughness: 0.1,
                emissive: 0xffff00,
                emissiveIntensity: 0.5
            });
            const coin = new THREE.Mesh(coinGeometry, coinMaterial);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(getLanePosition(lane), 1, -50);
            coin.userData = { type: 'coin', lane: lane };
            scene.add(coin);
            coins.push(coin);
        }

        function getLanePosition(lane) {
            return (lane * config.laneWidth) - config.laneWidth;
        }

        function spawnObject() {
            const lane = Math.floor(Math.random() * config.lanes);
            const spawnCoin = Math.random() > 0.4;

            if (spawnCoin) {
                createCoin(lane);
            } else {
                createObstacle(lane);
            }
        }

        function movePlayer() {
            // Smooth lane transition [web:7]
            const targetX = getLanePosition(gameState.targetLane);
            const diff = targetX - player.position.x;
            if (Math.abs(diff) > 0.01) {
                player.position.x += diff * config.playerSpeed;
            } else {
                player.position.x = targetX;
                gameState.currentLane = gameState.targetLane;
            }
        }

        function updateObstacles(delta) {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                obstacle.position.z += gameState.speed;
                obstacle.rotation.y += delta * 2;

                // Check collision
                if (Math.abs(obstacle.position.z - player.position.z) < 1.5 &&
                    Math.abs(obstacle.position.x - player.position.x) < 1.5) {
                    scene.remove(obstacle);
                    obstacles.splice(i, 1);
                    takeDamage();
                    continue;
                }

                // Remove if passed player
                if (obstacle.position.z > 10) {
                    scene.remove(obstacle);
                    obstacles.splice(i, 1);
                }
            }
        }

        function updateCoins(delta) {
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.position.z += gameState.speed;
                coin.rotation.y += delta * 5;

                // Check collection
                if (Math.abs(coin.position.z - player.position.z) < 1.5 &&
                    Math.abs(coin.position.x - player.position.x) < 1.5) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                    collectCoin();
                    continue;
                }

                // Remove if passed player
                if (coin.position.z > 10) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }
        }

        function updateGround() {
            groundSegments.forEach(segment => {
                segment.position.z += gameState.speed;
                if (segment.position.z > 20) {
                    segment.position.z -= 100;
                }
            });
        }

        function collectCoin() {
            gameState.score += 10;
            document.getElementById('score').textContent = `Score: ${gameState.score}`;
        }

        function takeDamage() {
            gameState.health--;
            updateHealthDisplay();

            if (gameState.health <= 0) {
                gameOver();
            }
        }

        function updateHealthDisplay() {
            const healthDiv = document.getElementById('health');
            healthDiv.innerHTML = '';
            for (let i = 0; i < gameState.health; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                healthDiv.appendChild(heart);
            }
        }

        function onKeyDown(event) {
            if (!gameState.isPlaying) return;

            switch(event.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (gameState.targetLane > 0) {
                        gameState.targetLane--;
                    }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (gameState.targetLane < config.lanes - 1) {
                        gameState.targetLane++;
                    }
                    break;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (gameState.isPlaying) {
                movePlayer();
                updateObstacles(delta);
                updateCoins(delta);
                updateGround();

                // Spawn objects [web:7]
                const now = Date.now();
                if (now - gameState.lastSpawn > config.spawnInterval) {
                    spawnObject();
                    gameState.lastSpawn = now;
                }

                // Gradually increase speed [web:7]
                if (gameState.speed < config.maxSpeed) {
                    gameState.speed += config.speedIncrease;
                }

                // Animate particles
                particleSystem.rotation.y += delta * 0.1;

                // Player animation
                player.rotation.y = Math.sin(Date.now() * 0.003) * 0.1;
            }

            renderer.render(scene, camera);
        }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            gameState.isPlaying = true;
            gameState.lastSpawn = Date.now();
        }

        function gameOver() {
            gameState.isPlaying = false;
            document.getElementById('finalScore').textContent = `Score: ${gameState.score}`;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function restartGame() {
            // Reset game state
            gameState = {
                score: 0,
                health: 3,
                speed: config.obstacleSpeed,
                isPlaying: true,
                currentLane: 1,
                targetLane: 1,
                lastSpawn: Date.now()
            };

            // Clear objects
            obstacles.forEach(obj => scene.remove(obj));
            coins.forEach(obj => scene.remove(obj));
            obstacles = [];
            coins = [];

            // Reset UI
            document.getElementById('score').textContent = 'Score: 0';
            updateHealthDisplay();
            document.getElementById('gameOverScreen').classList.add('hidden');

            // Reset player position
            player.position.x = 0;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize game when page loads
        init();
    </script>
</body>
</html>
